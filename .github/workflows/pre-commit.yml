---
on:
  workflow_call:
    outputs:
      changed_files:
        value: ${{ jobs.pre-commit.outputs.changed_files }}
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.file_changes.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

      # Check only the files changed by the PR or push. github.sha is the PR
      # merge commit, which checkout doesn't fetch, so use the event's SHAs.
      # Fall back to all files when there is no usable base (new branch,
      # force push).
      - name: Get changed files
        id: file_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] &&
            git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BASE_SHA...HEAD" | tr '\n' ' ')"
            echo "files=$files" >> "$GITHUB_OUTPUT"
            echo "args=--from-ref $BASE_SHA --to-ref HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "files=$(git ls-files | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            echo "args=--all-files" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache pre-commit since we use pre-commit from container
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ hashFiles('.pre-commit-config.yaml') }}

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: ${{ steps.file_changes.outputs.args }}
